backend:
  name: github
  repo: mvtijr/LiceoTrapaqueante
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "es"

collections:
  - name: "galerias"
    label: "Galerías de Fotos"
    files:
      - file: "src/data/galeria_general.json"
        label: "1. Galería General (Página Vida Escolar)"
        name: "galeria_general"
        fields:
          - { label: "Fotos", name: "fotos", widget: "list", field: { label: "Foto", name: "image", widget: "image" } }
      - file: "src/data/galeria_enfermeria.json"
        label: "2. Galería Enfermería"
        name: "galeria_enfermeria"
        fields:
          - { label: "Fotos", name: "fotos", widget: "list", field: { label: "Foto", name: "image", widget: "image" } }
      - file: "src/data/galeria_acuicultura.json"
        label: "3. Galería Acuicultura"
        name: "galeria_acuicultura"
        fields:
          - { label: "Fotos", name: "fotos", widget: "list", field: { label: "Foto", name: "image", widget: "image" } }
      - file: "src/data/galeria_ch.json"
        label: "4. Galería Científico Humanista"
        name: "galeria_ch"
        fields:
          - { label: "Fotos", name: "fotos", widget: "list", field: { label: "Foto", name: "image", widget: "image" } }
  
  - name: "documentos"
    label: "Documentos Institucionales"
    files:
      - file: "src/data/documentos.json"
        label: "Documentos para Descargar (PEI, RICE, etc.)"
        name: "documentos_oficiales"
        fields:
          - { label: "Lista de Documentos", name: "docs", widget: "list", fields: [
              { label: "Nombre del Documento", name: "title", widget: "string" },
              { label: "Descripción Corta", name: "desc", widget: "string", required: false },
              { label: "Archivo PDF", name: "file", widget: "file" }
            ] }
